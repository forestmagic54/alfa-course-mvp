services:
  backend:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE to your Docker Hub image name and tag}
    build: !reset null
  migrate:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE to your Docker Hub image name and tag}
    build: !reset null
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the frontend Docker Hub image name and tag}
    ports:
      - "${FRONTEND_PORT:?Set FRONTEND_PORT}:${FRONTEND_CONTAINER_PORT:?Set FRONTEND_CONTAINER_PORT}"
    depends_on:
      - backend
