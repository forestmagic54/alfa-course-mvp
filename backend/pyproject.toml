[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["KapHullloK <kirillov2136@yandex.ru>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.162.7"
uvicorn = "^0.54.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.1.8"}
asyncpg = "^0.32.0"
alembic = "^1.20.1"
pydantic-settings = "^2.16.3"
httpx = ">=0.28,<1"
email-validator = "^2.3.0"
pyjwt = "^2.15.1"
pwdlib = {extras = ["argon2"], version = "^0.3.1"}
numpy = ">=2.3,<3"
pandas = ">=2.2,<3"
scipy = ">=1.16,<2"
scikit-learn = ">=1.8,<2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.5,<0.18.0)"
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/clients"]
addopts = "-q --tb=short --strict-config --strict-markers"
